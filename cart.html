<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — ACH Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Show the cart drawer as a normal in-page panel instead of a slide-over */
#cartOverlay{display:none !important;}
#cartDrawer{position:static !important;transform:none !important;width:100%;max-width:640px;height:auto;
  margin:0 auto;box-shadow:0 10px 40px rgba(58,46,56,0.08);border-radius:20px;border:1px solid var(--stone);}
.drawer-close{display:none;}
</style>
</head>
<body>

<div id="chrome-header"></div>

<div class="page-wrap">
  <div class="breadcrumb"><a href="index.html">Shop</a> / Your Bag</div>
  <h1 class="page-title">Your Bag</h1>
  <div id="cartDrawer">
    <div class="drawer-head"><h3>Items</h3></div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </div>
</div>

<div id="chrome-footer"></div>
<div id="chrome-overlays"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init('I4iWZBJq_43MymLwS');</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="shared.js"></script>
<script src="chrome.js"></script>
<script>
injectSharedChrome();
// The chrome injects its OWN cart drawer into #chrome-overlays for the mini-cart icon.
// This page also has a static, always-visible copy of the cart markup above for the full-page view.
// Both share the same #cartBody/#cartFoot ids is a problem, so give the overlay one different ids:
document.addEventListener('DOMContentLoaded', fixIds);
fixIds();
function fixIds(){
  // Rename the injected overlay drawer's ids so they don't collide with the page's own cart panel
  const overlayDrawer = document.querySelector('#chrome-overlays .drawer');
  if(overlayDrawer){
    overlayDrawer.id = 'cartDrawerMini';
    const b = overlayDrawer.querySelector('.drawer-body'); if(b) b.id='cartBodyMini';
    const f = overlayDrawer.querySelector('.drawer-foot'); if(f) f.id='cartFootMini';
  }
}
function onProductsLoaded(){ renderCart(); }
init();
</script>

</body>
</html>
