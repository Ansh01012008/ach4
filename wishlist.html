<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist — ACH Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
#wishModalBg{position:static !important;background:none !important;opacity:1 !important;pointer-events:auto !important;padding:0 !important;display:block !important;}
#wishModal{max-width:640px;margin:0 auto;box-shadow:0 10px 40px rgba(58,46,56,0.08);border-radius:20px;border:1px solid var(--stone);}
#wishModal .modal-close{display:none;}
</style>
</head>
<body>

<div id="chrome-header"></div>

<div class="page-wrap">
  <div class="breadcrumb"><a href="index.html">Shop</a> / Your Wishlist</div>
  <h1 class="page-title" style="display:none;">Your Wishlist</h1>
  <div class="modal-bg" id="wishModalBg"><div class="modal narrow" id="wishModal"></div></div>
</div>

<div id="chrome-footer"></div>
<div id="chrome-overlays"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init('I4iWZBJq_43MymLwS');</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="shared.js"></script>
<script src="chrome.js"></script>
<script>
injectSharedChrome();
// Avoid duplicate-id collisions with the header's own wishlist modal (used for account/size-guide too)
(function(){
  const overlayModal = document.querySelectorAll('#chrome-overlays #wishModalBg');
  if(overlayModal.length){ overlayModal[0].id = 'wishModalBgMini'; overlayModal[0].querySelector('.modal').id = 'wishModalMini'; }
})();
function onProductsLoaded(){ openWishlistView(); }
init();
</script>

</body>
</html>
