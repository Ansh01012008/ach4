<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist — ACH Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* The real wishlist content is injected by chrome.js as #wishModalBg/#wishModal
   (also reused for the account panel and size guide). We just make itsit
   inline on this page instead of floating as a fixed overlay. */
#wishModalBg{position:static !important;background:none !important;opacity:1 !important;pointer-events:auto !important;padding:0 !important;display:block !important;}
#wishModalBg .modal{max-width:640px;margin:0 auto;box-shadow:0 10px 40px rgba(58,46,56,0.08);border-radius:20px;border:1px solid var(--stone);}
#wishModalBg .modal-close{display:none;}
</style>
</head>
<body>

<div id="chrome-header"></div>

<div class="page-wrap" style="padding-bottom:0;">
  <div class="breadcrumb"><a href="index.html">Shop</a> / Your Wishlist</div>
</div>

<div id="chrome-overlays"></div>
<div id="chrome-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init('I4iWZBJq_43MymLwS');</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="shared.js"></script>
<script src="chrome.js"></script>
<script>
injectSharedChrome();
// No rename here — this page wants the REAL #wishModalBg/#wishModal (injected
// by chrome.js) to keep their real ids, so openWishlistView() fills them correctly.
function onProductsLoaded(){ openWishlistView(); }
init();
</script>

</body>
</html>
